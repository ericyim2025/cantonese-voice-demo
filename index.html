<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>粵語語音輸入</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700&display=swap">
<style>
  /* Layout: single centred column — status, big mic button, editable transcript, actions */
  :root {
    --bg: #f5f7f6; --surface: #ffffff; --fg: #1d2522; --muted: #5d6a65;
    --line: #d9e0dd; --accent: #0f7b6c; --accent-fg: #ffffff; --live: #c2410c;
    --font: "Noto Sans HK", "Microsoft JhengHei", "PingFang HK", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121816; --surface: #1b2320; --fg: #e6ece9; --muted: #9aa8a2;
      --line: #2e3a36; --accent: #34b3a0; --accent-fg: #0c1311; --live: #fb923c; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 16px/1.6 var(--font);
    padding: 32px max(16px, env(safe-area-inset-left)) 48px; }
  main { max-width: 760px; margin: 0 auto; display: grid; gap: 20px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
  h1 { font-size: 1.6rem; margin: 0; font-weight: 700; }
  .hint { color: var(--muted); font-size: .9rem; margin: 0; }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; }
  #mic { width: 88px; height: 88px; border-radius: 50%; border: 0; cursor: pointer;
    background: var(--accent); color: var(--accent-fg); display: grid; place-items: center;
    transition: transform .15s, background .15s; flex: none; }
  #mic:hover { transform: scale(1.04); }
  #mic:focus-visible, button:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  #mic.on { background: var(--live); animation: pulse 1.6s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--live) 45%, transparent); } 100% { box-shadow: 0 0 0 18px transparent; } }
  @media (prefers-reduced-motion: reduce) { #mic.on { animation: none; } }
  #mic svg { width: 36px; height: 36px; }
  .side { display: grid; gap: 8px; min-width: 0; flex: 1; }
  #status { font-weight: 500; }
  #status.on { color: var(--live); }
  label { font-size: .85rem; color: var(--muted); }
  select { font: inherit; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--surface); color: var(--fg); }
  .box { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
  textarea { width: 100%; min-height: 280px; resize: vertical; border: 0; background: transparent;
    color: var(--fg); font: 1.15rem/1.8 var(--font); padding: 14px; }
  #interim { min-height: 1.8em; padding: 0 14px 10px; color: var(--muted); font-style: italic; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; }
  .actions button { font: inherit; font-size: .95rem; padding: 8px 16px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--line); background: var(--surface); color: var(--fg); }
  .actions button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  #warn { background: color-mix(in srgb, var(--live) 12%, var(--surface)); border: 1px solid var(--live);
    border-radius: 10px; padding: 12px 14px; }
  footer { color: var(--muted); font-size: .85rem; }
  kbd { font-family: inherit; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; background: var(--surface); }
</style>
</head>
<body>
<main>
  <header>
    <h1>粵語語音輸入</h1>
    <p class="hint">撳咪高峰開始講嘢，再撳一下停。快捷鍵 <kbd>Ctrl</kbd> + <kbd>Space</kbd></p>
  </header>

  <div id="warn" hidden></div>

  <div class="controls">
    <button id="mic" aria-label="開始錄音">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"></rect>
        <path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path>
      </svg>
    </button>
    <div class="side">
      <div id="status">準備好</div>
      <div>
        <label for="lang">語言</label>
        <select id="lang">
          <option value="auto">粵語（自動揀）</option>
          <option value="yue-Hant-HK">粵語 yue-Hant-HK（Chrome 用）</option>
          <option value="zh-HK">粵語 zh-HK（Edge 用）</option>
          <option value="zh-TW">普通話（繁體）</option>
          <option value="en-GB">English (UK)</option>
        </select>
      </div>
    </div>
  </div>

  <div class="box">
    <textarea id="text" aria-label="轉出嚟嘅文字，可以直接改" autofocus></textarea>
    <div id="interim" aria-live="polite"></div>
  </div>

  <div class="actions">
    <button id="copy" class="primary">複製全部</button>
    <button id="newline">換行</button>
    <button id="punct">加句號</button>
    <button id="clear">清除</button>
  </div>

  <footer>
    提示：請用 Chrome 或者 Edge 開呢個檔案，第一次用會問你批唔批准用咪高峰。語音會經瀏覽器傳去 Google（Chrome）或者 Microsoft（Edge）嘅伺服器轉文字，所以要上網，唔好講敏感資料。轉出嚟嘅字可以直接喺上面改，改完撳「複製全部」貼去 Claude 或者其他地方。
  </footer>
</main>

<script>
(function () {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const $ = (id) => document.getElementById(id);
  const mic = $("mic"), status = $("status"), text = $("text"), interim = $("interim"),
        langSel = $("lang"), warn = $("warn");

  function showWarn(msg) { warn.textContent = msg; warn.hidden = false; }

  if (!SR) {
    showWarn("呢個瀏覽器唔支援語音輸入。請用 Chrome 或者 Microsoft Edge 開呢個檔案。");
    mic.disabled = true;
    return;
  }

  const isEdge = /Edg\//.test(navigator.userAgent);
  function pickLang() {
    const v = langSel.value;
    if (v !== "auto") return v;
    return isEdge ? "zh-HK" : "yue-Hant-HK";
  }

  let rec = null, listening = false;


  function append(s) {
    const start = text.selectionStart, end = text.selectionEnd;
    const atEnd = document.activeElement !== text || start === text.value.length;
    if (atEnd) {
      text.value += s;
      text.scrollTop = text.scrollHeight;
    } else {
      text.setRangeText(s, start, end, "end");
    }
  }

  function setUI(on) {
    listening = on;
    mic.classList.toggle("on", on);
    status.classList.toggle("on", on);
    mic.setAttribute("aria-label", on ? "停止錄音" : "開始錄音");
    status.textContent = on ? "聽緊……講啦" : "已停止";
    if (!on) interim.textContent = "";
  }

  function start() {
    rec = new SR();
    rec.lang = pickLang();
    rec.continuous = true;
    rec.interimResults = true;

    rec.onresult = (e) => {
      let tmp = "";
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const r = e.results[i];
        if (r.isFinal) append(r[0].transcript.trim());
        else tmp += r[0].transcript;
      }
      interim.textContent = tmp;
    };
    rec.onerror = (e) => {
      if (e.error === "not-allowed" || e.error === "service-not-allowed") {
        showWarn("用唔到咪高峰。請喺瀏覽器網址列旁邊批准咪高峰權限，再試一次。");
        stop();
      } else if (e.error === "network") {
        showWarn("連唔到語音伺服器，請檢查網絡。");
        stop();
      } else if (e.error === "language-not-supported") {
        showWarn("呢個瀏覽器唔支援所揀嘅語言，試吓喺「語言」轉第二個粵語選項。");
        stop();
      }
      // "no-speech" and "aborted" are handled by auto-restart
    };
    rec.onend = () => {
      // Browsers stop after silence; keep going until the user presses stop
      if (listening) { try { rec.start(); } catch (_) { setUI(false); } }
    };
    try {
      rec.start();
      warn.hidden = true;
      setUI(true);
    } catch (err) {
      showWarn("開唔到語音輸入：" + err.message);
    }
  }

  function stop() {
    listening = false;
    if (rec) { rec.onend = null; try { rec.stop(); } catch (_) {} }
    setUI(false);
  }

  mic.addEventListener("click", () => listening ? stop() : start());
  document.addEventListener("keydown", (e) => {
    if (e.ctrlKey && e.code === "Space") { e.preventDefault(); listening ? stop() : start(); }
  });
  langSel.addEventListener("change", () => { if (listening) { stop(); start(); } });

  $("newline").addEventListener("click", () => append("\n"));
  $("punct").addEventListener("click", () => append("。"));
  $("clear").addEventListener("click", () => { text.value = ""; text.focus(); });
  $("copy").addEventListener("click", async (e) => {
    const btn = e.currentTarget;
    try {
      await navigator.clipboard.writeText(text.value);
      btn.textContent = "已複製";
    } catch (_) {
      text.select();
      btn.textContent = "已揀晒，撳 Ctrl+C";
    }
    setTimeout(() => (btn.textContent = "複製全部"), 1800);
  });
})();
</script>
</body>
</html>
